# Groundskeeper on any Docker host:  docker compose up -d   then open http://<this host>:8425
# Everything site-specific (the robot's address, Frigate, Home Assistant, ...) is set in the panel (Settings), or
# as defaults in .env next to this file (copy .env.example; chmod 600, it can hold the HA token).
services:
  groundskeeper:
    image: ghcr.io/groundskeeper-robot/groundskeeper:latest
    container_name: groundskeeper
    restart: unless-stopped
    # Host networking is only needed to receive a Tempest weather station's UDP broadcast (port 50222); the panel
    # then listens on 8425 directly on the host. Without a Tempest, remove network_mode and publish the port:
    #   ports:
    #     - "8425:8425"
    network_mode: host
    environment:
      DATA_DIR: /data
      PORT: "8425"
      # The user the panel runs as (it owns ./data). Match your own with `id -u` / `id -g` to edit files there.
      PUID: "1000"
      PGID: "1000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8425/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
