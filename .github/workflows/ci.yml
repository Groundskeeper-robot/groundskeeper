name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Every check (scripts/check.py, the same command contributors run)
        run: python scripts/check.py

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: No private addresses, personal emails or real robot data
        run: python scripts/check_public.py
      # The gitleaks CLI (MIT) rather than gitleaks-action, which needs a paid licence key for organisation repos.
      - name: No secrets (gitleaks, whole history)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: groundskeeper:ci
          build-args: PANEL_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts (demo mode) and answers /health as a non-root user
        run: |
          docker run -d --name gk -p 8425:8425 -e DEMO=1 groundskeeper:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8425/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8425/health
          test "$(docker exec gk awk '/^Uid:/{print $2}' /proc/1/status)" = 1000
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8425/api/status)" = 401
      - if: always()
        run: docker logs gk || true
