name: Feature request
description: Something the panel should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The problem first, then any idea for a solution
    validations:
      required: true
  - type: textarea
    id: robot
    attributes:
      label: Does it need a new robot command?
      description: |
        The panel only sends commands captured from the official app. If this needs one, say what you do in the
        Yarbo app to get the same result (see "Recording an app edit" in CONTRIBUTING.md).
