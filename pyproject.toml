# Packaging for Groundskeeper so it installs as a library (pip / uv), on top of
# the existing container/requirements workflow (both still work — the Dockerfile
# and requirements*.txt are unchanged). Lets other tools depend on `app` and lets
# contributors use `uv sync` / `uv run -m app`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundskeeper"
dynamic = ["version"]                 # read from app/version.py (single source of truth)
description = "Self-hosted recorder, map and guarded control panel for Yarbo robots."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["yarbo", "robot-mower", "rtk", "mqtt", "self-hosted", "gis"]

# Runtime dependencies mirror requirements.txt (kept in place for the Docker build).
dependencies = [
    "fastapi>=0.162.0,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "paho-mqtt>=2.2.0,<3",
    "httpx>=0.28.1,<1",
    "yarbo-data-sdk==0.3.0",          # PolyForm Noncommercial 1.0.0 (THIRD_PARTY_NOTICES.md)
    "pillow>=13.0.0,<14",
    "numpy>=2.5.4,<3",
    "mcp>=2.3,<3",
    "pyjwt[crypto]>=2.10.1,<3",       # OIDC ID tokens (app/oidc.py); mcp needs it too
]

[project.urls]
Homepage = "https://github.com/Groundskeeper-robot/groundskeeper"
Repository = "https://github.com/Groundskeeper-robot/groundskeeper"

# Dev tooling, mirroring requirements-dev.txt. A PEP 735 group: `uv sync` installs
# it by default; pip users keep using `pip install -r requirements-dev.txt`.
[dependency-groups]
dev = [
    "pytest",
    "jsonschema>=4.26.0",
    "shapely>=2.2.0",
]

[tool.hatch.version]
path = "app/version.py"               # __version__

# The wheel is the library (app/). The panel's bundled catalog/, web/ and docs/ are found beside app/, so running
# the panel itself still needs a checkout or the container (#9).
[tool.hatch.build.targets.wheel]
packages = ["app"]
